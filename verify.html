<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey Chain - Verify Honey</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
        }

        header h1 {
            font-size: 25px;
        }

        .container {
            width: 92%;
            max-width: 850px;
            margin: 30px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .title p {
            color: #666;
        }

        .verified-box {
            background: #dcfce7;
            border: 2px solid #22c55e;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
        }

        .verified-box .check {
            font-size: 45px;
        }

        .verified-box h2 {
            color: #15803d;
            margin: 8px 0;
        }

        .verified-box p {
            color: #166534;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
        }

        .detail strong {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .detail span {
            font-size: 16px;
            font-weight: bold;
        }

        .journey {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }

        .step {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #22c55e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-weight: bold;
        }

        .step h3 {
            font-size: 14px;
        }

        .step p {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
        }

        .blockchain {
            background: #111827;
            color: white;
        }

        .blockchain p {
            color: #d1d5db;
            line-height: 1.6;
        }

        .hash {
            background: #1f2937;
            padding: 14px;
            border-radius: 8px;
            margin-top: 15px;
            font-family: monospace;
            word-break: break-all;
            color: #e5e7eb;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            background: #f59e0b;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            font-weight: bold;
        }

        .button:hover {
            background: #d97706;
        }

        .error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .error h2 {
            color: #b91c1c;
            margin-bottom: 10px;
        }

        .error p {
            color: #7f1d1d;
        }

        @media (max-width: 650px) {
            .details {
                grid-template-columns: 1fr;
            }

            .journey {
                flex-direction: column;
                gap: 18px;
            }

            .container {
                width: 94%;
            }

            header {
                padding: 15px 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🐝 Honey Chain</h1>
</header>

<div class="container">

    <div class="title">
        <h2>🍯 Honey Verification</h2>
        <p>Blockchain-based honey traceability</p>
    </div>

    <div id="content"></div>

</div>

<script>

    /*
     * First try to read information from the QR code URL.
     * This allows verification on ANY phone.
     */

    const params = new URLSearchParams(window.location.search);

    let batchId = params.get("batchId");
    let beekeeper = params.get("beekeeper");
    let location = params.get("location");
    let floral = params.get("floral");
    let harvestDate = params.get("harvestDate");
    let quantity = params.get("quantity");
    let moisture = params.get("moisture");

    /*
     * If the page was opened normally on the same computer,
     * use localStorage as a backup.
     */

    if (!batchId) {
        batchId = localStorage.getItem("batchId");
        beekeeper = localStorage.getItem("beekeeper");
        location = localStorage.getItem("location");
        floral = localStorage.getItem("floral");
        harvestDate = localStorage.getItem("harvestDate");
        quantity = localStorage.getItem("quantity");
        moisture = localStorage.getItem("moisture");
    }

    const content = document.getElementById("content");

    if (!batchId) {

        content.innerHTML = `
            <div class="error">
                <h2>❌ Batch Not Found</h2>
                <p>
                    No honey batch information was found.
                    Please scan a valid Honey Chain QR code.
                </p>

                <div class="buttons">
                    <a class="button" href="dashboard.html">
                        ← Dashboard
                    </a>
                </div>
            </div>
        `;

    } else {

        content.innerHTML = `

            <div class="verified-box">

                <div class="check">✓</div>

                <h2>HONEY VERIFIED</h2>

                <p>
                    This batch has a valid Honey Chain traceability record.
                </p>

            </div>


            <div class="card">

                <h2>📦 Batch Information</h2>

                <div class="details">

                    <div class="detail">
                        <strong>Batch ID</strong>
                        <span>${batchId}</span>
                    </div>

                    <div class="detail">
                        <strong>Beekeeper</strong>
                        <span>${beekeeper || "Not available"}</span>
                    </div>

                    <div class="detail">
                        <strong>Origin</strong>
                        <span>${location || "Not available"}</span>
                    </div>

                    <div class="detail">
                        <strong>Floral Source</strong>
                        <span>${floral || "Not available"}</span>
                    </div>

                    <div class="detail">
                        <strong>Harvest Date</strong>
                        <span>${harvestDate || "Not available"}</span>
                    </div>

                    <div class="detail">
                        <strong>Quantity</strong>
                        <span>${quantity || "Not available"} kg</span>
                    </div>

                    <div class="detail">
                        <strong>Moisture</strong>
                        <span>${moisture || "Not available"}%</span>
                    </div>

                </div>

            </div>


            <div class="card">

                <h2>🌱 Honey Journey</h2>

                <div class="journey">

                    <div class="step">
                        <div class="circle">1</div>
                        <h3>Harvested</h3>
                        <p>Hive</p>
                    </div>

                    <div class="step">
                        <div class="circle">2</div>
                        <h3>Processed</h3>
                        <p>Processing Unit</p>
                    </div>

                    <div class="step">
                        <div class="circle">3</div>
                        <h3>Packaged</h3>
                        <p>Packaging</p>
                    </div>

                    <div class="step">
                        <div class="circle">4</div>
                        <h3>Distributed</h3>
                        <p>Market</p>
                    </div>

                </div>

            </div>


            <div class="card blockchain">

                <h2>🔗 Blockchain Record</h2>

                <p>
                    The batch is linked to a cryptographic hash-chain
                    record. Changes to linked records can be detected
                    through hash verification.
                </p>

                <div class="hash">
                    Transaction ID: HC2026A83F91
                </div>

            </div>


            <div class="buttons">

                <a class="button" href="dashboard.html">
                    ← Dashboard
                </a>

                <a class="button" href="supply-chain.html">
                    🌱 Supply Chain
                </a>

                <a class="button" href="blockchain.html">
                    🔗 Blockchain
                </a>

            </div>

        `;
    }

</script>

</body>
</html>
