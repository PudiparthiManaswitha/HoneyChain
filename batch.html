<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Honey Chain - Batch Details</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            font-size: 26px;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
        }

        .detail strong {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .detail span {
            font-size: 17px;
            font-weight: bold;
        }

        .qr-section {
            text-align: center;
        }

        .qr-section img {
            width: 220px;
            height: 220px;
            display: block;
            margin: 20px auto;
            border: 8px solid white;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        .scan-note {
            background: #fff7ed;
            color: #92400e;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .blockchain {
            background: #111827;
            color: white;
        }

        .blockchain p {
            color: #d1d5db;
            line-height: 1.6;
        }

        .transaction {
            margin-top: 15px;
            background: #1f2937;
            padding: 14px;
            border-radius: 8px;
            font-family: monospace;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            background: #f59e0b;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            font-weight: bold;
        }

        .button:hover {
            background: #d97706;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        @media (max-width: 650px) {

            .details {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }

            header {
                padding: 18px 20px;
            }

            .card {
                padding: 20px;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>🐝 Honey Chain</h1>

</header>


<div class="container">

    <div id="content"></div>

</div>


<script>

    /* Get batch information */

    const batchId = localStorage.getItem("batchId");
    const beekeeper = localStorage.getItem("beekeeper");
    const location = localStorage.getItem("location");
    const floral = localStorage.getItem("floral");
    const harvestDate = localStorage.getItem("harvestDate");
    const quantity = localStorage.getItem("quantity");
    const moisture = localStorage.getItem("moisture");


    const content = document.getElementById("content");


    /* Check whether a batch exists */

    if (!batchId) {

        content.innerHTML = `

            <div class="error">

                <h2>❌ No Batch Found</h2>

                <p>
                    Please create a honey batch first.
                </p>

                <br>

                <a class="button" href="create-batch.html">
                    Create Batch
                </a>

            </div>

        `;

    }

    else {

        /*
         * Create the online verification URL.
         */

        const verifyURL =
            "https://aayushkumarjha67.github.io/HoneyChain/verify.html" +

            "?batchId=" + encodeURIComponent(batchId) +

            "&beekeeper=" + encodeURIComponent(beekeeper || "") +

            "&location=" + encodeURIComponent(location || "") +

            "&floral=" + encodeURIComponent(floral || "") +

            "&harvestDate=" + encodeURIComponent(harvestDate || "") +

            "&quantity=" + encodeURIComponent(quantity || "") +

            "&moisture=" + encodeURIComponent(moisture || "");


        /*
         * QR code image.
         * No JavaScript QR library is required.
         */

        const qrURL =
            "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
            encodeURIComponent(verifyURL);


        content.innerHTML = `

            <div class="card">

                <h2>🍯 Honey Batch Details</h2>


                <div class="details">

                    <div class="detail">

                        <strong>Batch ID</strong>

                        <span>${batchId}</span>

                    </div>


                    <div class="detail">

                        <strong>Beekeeper</strong>

                        <span>${beekeeper || "Not available"}</span>

                    </div>


                    <div class="detail">

                        <strong>Origin</strong>

                        <span>${location || "Not available"}</span>

                    </div>


                    <div class="detail">

                        <strong>Floral Source</strong>

                        <span>${floral || "Not available"}</span>

                    </div>


                    <div class="detail">

                        <strong>Harvest Date</strong>

                        <span>${harvestDate || "Not available"}</span>

                    </div>


                    <div class="detail">

                        <strong>Quantity</strong>

                        <span>${quantity || "Not available"} kg</span>

                    </div>


                    <div class="detail">

                        <strong>Moisture</strong>

                        <span>${moisture || "Not available"}%</span>

                    </div>

                </div>

            </div>


            <div class="card qr-section">

                <h2>📱 Scan to Verify Honey</h2>

                <p>
                    Scan this QR code with a smartphone.
                </p>


                <img
                    src="${qrURL}"
                    alt="Honey Chain QR Code"
                >


                <p>

                    <strong>Batch:</strong>
                    ${batchId}

                </p>


                <div class="scan-note">

                    📱 Scanning this QR code opens the
                    online Honey Chain verification page.

                </div>

            </div>


            <div class="card blockchain">

                <h2>🔗 Blockchain Record</h2>

                <p>

                    This batch is linked to a
                    cryptographic hash-chain record.
                    Changes to linked records can be detected
                    through hash verification.

                </p>


                <div class="transaction">

                    Transaction ID:
                    HC2026A83F91

                </div>

            </div>


            <div class="buttons">

                <a class="button" href="dashboard.html">
                    ← Dashboard
                </a>


                <a class="button" href="supply-chain.html">
                    🌱 Supply Chain
                </a>


                <a class="button" href="blockchain.html">
                    🔗 Blockchain
                </a>

            </div>

        `;

    }

</script>

</body>
</html>
