<!DOCTYPE html>
<html>

<head>

    <title>Honey Batch Details</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8e7;
        }

        .header {
            background: #d88900;
            color: white;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 700px;
            margin: 35px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            color: #d88900;
        }

        .verified {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail {
            background: #fff8e7;
            padding: 15px;
            border-radius: 8px;
        }

        .label {
            font-size: 13px;
            color: #777;
        }

        .value {
            font-size: 17px;
            font-weight: bold;
            margin-top: 5px;
        }

        .blockchain {
            margin-top: 25px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .qr {
            margin-top: 25px;
            text-align: center;
        }

        .qr img {
            width: 180px;
            height: 180px;
            border: 5px solid white;

        }

    </style>

</head>

<body>

    <div class="header">
        🐝 Honey Chain
    </div>


    <div class="container">

        <h1>Honey Batch Details</h1>

        <div class="verified">
            ✓ BATCH VERIFIED
        </div>


        <div class="details">

            <div class="detail">
                <div class="label">Batch ID</div>
                <div class="value" id="showBatchId"></div>
            </div>

            <div class="detail">
                <div class="label">Beekeeper</div>
                <div class="value" id="showBeekeeper"></div>
            </div>

            <div class="detail">
                <div class="label">Location</div>
                <div class="value" id="showLocation"></div>
            </div>

            <div class="detail">
                <div class="label">Floral Source</div>
                <div class="value" id="showFloral"></div>
            </div>

            <div class="detail">
                <div class="label">Harvest Date</div>
                <div class="value" id="showDate"></div>
            </div>

            <div class="detail">
                <div class="label">Quantity</div>
                <div class="value" id="showQuantity"></div>
            </div>

            <div class="detail">
                <div class="label">Moisture</div>
                <div class="value" id="showMoisture"></div>
            </div>

            <div class="detail">
                <div class="label">Status</div>
                <div class="value">Verified</div>
            </div>

        </div>


        <div class="blockchain">

            <h3>🔗 Blockchain Record</h3>

            <p>✓ Batch recorded on blockchain</p>

            <p>
                Transaction ID:
                <b>HC2026A83F91</b>
            </p>

            <p>
                Record Status:
                <b>Immutable ✓</b>
            </p>

        </div>


        <div class="qr">

            <h3>📱 Scan to Verify</h3>

            <img id="qrImage" alt="Honey Batch QR Code">

            <p id="qrBatch"></p>

        </div>

    </div>


    <script>

        let batchId = localStorage.getItem("batchId");

        let beekeeper = localStorage.getItem("beekeeper");

        let location = localStorage.getItem("location");

        let floral = localStorage.getItem("floral");

        let harvestDate = localStorage.getItem("harvestDate");

        let quantity = localStorage.getItem("quantity");

        let moisture = localStorage.getItem("moisture");


        document.getElementById("showBatchId").innerText =
            batchId;

        document.getElementById("showBeekeeper").innerText =
            beekeeper;

        document.getElementById("showLocation").innerText =
            location;

        document.getElementById("showFloral").innerText =
            floral;

        document.getElementById("showDate").innerText =
            harvestDate;

        document.getElementById("showQuantity").innerText =
            quantity + " kg";

        document.getElementById("showMoisture").innerText =
            moisture + "%";


        document.getElementById("qrBatch").innerText =
            "Batch: " + batchId;


        // Create QR code using the current batch ID

        let verificationLink =
            "https://example.com/verify.html?batch=" +
            encodeURIComponent(batchId);


        let qrURL =
            "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" +
            encodeURIComponent(verificationLink);


        document.getElementById("qrImage").src = qrURL;

    </script>

</body>

</html>
