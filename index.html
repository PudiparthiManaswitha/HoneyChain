
<!DOCTYPE html>
<html>

<head>

    <title>Honey Chain - Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8e7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            width: 380px;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .bee {
            font-size: 60px;
        }

        h1 {
            margin: 10px 0;
            color: #d88900;
        }

        p {
            color: #666;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 95%;
            padding: 13px;
            margin-top: 15px;
            background: #d88900;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b96f00;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="bee">🐝</div>

        <h1>Honey Chain</h1>

        <p>Blockchain-Based Honey Traceability</p>

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button onclick="login()">
            Login
        </button>

    </div>


    <script>

        function login() {

            let email = document.getElementById("email").value;

            let password = document.getElementById("password").value;


            if (email === "" || password === "") {

                alert("Please enter email and password");

                return;

            }


            // Go to Dashboard

            window.location.href = "dashboard.html";

        }

    </script>

</body>

</html>
